<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Government Officer Dashboard - GramGuard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        th { background-color: #2c3e50; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 12px; }
        .bg-Critical { background-color: #e74c3c; }
        .bg-High { background-color: #e67e22; }
        .bg-Medium { background-color: #f1c40f; color: #333; }
        .bg-Low { background-color: #2ecc71; }
        .category-tag { background-color: #e8f4f8; color: #2980b9; padding: 2px 6px; border-radius: 3px; font-weight: 600; font-size: 13px; }
        .logout-btn { background: #e74c3c; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Government Officer Dashboard</h1>
        <a href="/" class="logout-btn">🔒 Logout</a>
    </div>

    <!-- METRICS CARDS -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <div class="card" style="margin-bottom: 0; text-align: center; border-left: 5px solid #2980b9;">
            <span style="font-size: 13px; color: #7f8c8d; font-weight: bold;">TOTAL COMPLAINTS</span>
            <h2 id="statTotal" style="margin: 5px 0 0 0; color: #2c3e50;">0</h2>
        </div>
        <div class="card" style="margin-bottom: 0; text-align: center; border-left: 5px solid #e74c3c;">
            <span style="font-size: 13px; color: #7f8c8d; font-weight: bold;">URGENT PENDING</span>
            <h2 id="statUrgent" style="margin: 5px 0 0 0; color: #e74c3c;">0</h2>
        </div>
        <div class="card" style="margin-bottom: 0; text-align: center; border-left: 5px solid #2ecc71;">
            <span style="font-size: 13px; color: #7f8c8d; font-weight: bold;">RESOLVED</span>
            <h2 id="statResolved" style="margin: 5px 0 0 0; color: #2ecc71;">0</h2>
        </div>
        <div class="card" style="margin-bottom: 0; text-align: center; border-left: 5px solid #8e44ad;">
            <span style="font-size: 13px; color: #7f8c8d; font-weight: bold;">DUPLICATES DETECTED</span>
            <h2 id="statDuplicates" style="margin: 5px 0 0 0; color: #8e44ad;">0</h2>
        </div>
    </div>

    <!-- COMPLAINTS QUEUE TABLE -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2>Grievance Queue (Prioritized)</h2>
            <a href="/api/complaints/export" download style="background: #2980b9; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold;">📥 Export CSV Report</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Village</th>
                    <th>Complaint Details</th>
                    <th>Category & Assigned Dept</th>
                    <th>Priority</th>
                    <th>Status Action</th>
                </tr>
            </thead>
            <tbody id="complaintsTable"></tbody>
        </table>
    </div>

    <!-- GEOGRAPHIC HOTSPOT MAP -->
    <div class="card">
        <h2>🗺️ Geographic Hotspot Analytics Map</h2>
        <div id="map" style="height: 320px; width: 100%; border-radius: 6px;"></div>
    </div>
</div>

<script>
    let map = L.map('map').setView([16.7865, 81.8288], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    async function loadAdminData() {
        try {
            const statsRes = await fetch('/api/stats');
            const stats = await statsRes.json();
            document.getElementById('statTotal').innerText = stats.total;
            document.getElementById('statUrgent').innerText = stats.high_priority;
            document.getElementById('statResolved').innerText = stats.resolved;
            document.getElementById('statDuplicates').innerText = stats.duplicates;

            const compRes = await fetch('/api/complaints');
            const complaints = await compRes.json();
            const tableBody = document.getElementById('complaintsTable');
            tableBody.innerHTML = '';

            complaints.forEach(item => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td><b>${item.village}</b></td>
                        <td>${item.complaint}</td>
                        <td>
                            <span class="category-tag">${item.category || 'General'}</span><br>
                            <small style="color: #7f8c8d; display: inline-block; margin-top: 4px;">🏢 ${item.department || 'Panchayat Raj'}</small>
                        </td>
                        <td><span class="badge bg-${item.priority || 'Medium'}">${item.priority || 'Medium'}</span></td>
                        <td>
                            <select onchange="updateStatus(${item.id}, this.value)">
                                <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="In Progress" ${item.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Resolved" ${item.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                <option value="Duplicate" ${item.status === 'Duplicate' ? 'selected' : ''}>Duplicate</option>
                            </select>
                        </td>
                    </tr>
                `;

                L.marker([16.7865 + (Math.random()-0.5)*0.05, 81.8288 + (Math.random()-0.5)*0.05]).addTo(map)
                    .bindPopup(`<b>${item.village}</b> [${item.category}]: ${item.complaint}`);
            });
        } catch (err) {
            console.error('Error loading dashboard data:', err);
        }
    }

    async function updateStatus(id, status) {
        await fetch(`/api/complaints/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadAdminData();
    }

    loadAdminData();
</script>
</body>
</html>
